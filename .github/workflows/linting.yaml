name: Code Quality (Linting)

on: [push, pull_request]

jobs:
  style-and-logic:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # -------------------------
      # Clang Format
      # -------------------------
      - name: Install Clang-Format
        run: sudo apt-get update && sudo apt-get install -y clang-format cppcheck

      - name: Check Formatting
        run: |
          find . -type f \( -name "*.h" -o -name "*.hpp" -o -name "*.c" -o -name "*.cc" -o -name "*.cpp" \) \
            -not -path "./.git/*" \
            -not -path "./build/*" \
            -print0 | xargs -0 clang-format --dry-run --Werror

      - name: Set up Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Install Arduino Mbed Nano core
        run: |
          arduino-cli core update-index
          arduino-cli core install arduino:mbed_nano

      - name: Compile Sketch (Arduino CLI)
        run: |
          # Create a separate folder for build artifacts
          mkdir -p build_dir
          arduino-cli compile --fqbn arduino:mbed_nano:nano33ble --build-path ./build_dir .

      - name: Compile Sketch (Arduino CLI, LOOCV mode)
        run: |
          mkdir -p build_dir_loocv
          arduino-cli compile --fqbn arduino:mbed_nano:nano33ble \
            --build-path ./build_dir_loocv \
            --build-property compiler.cpp.extra_flags="-DSTREAMING_USE_LOOCV" .

      - name: Static Analysis (cppcheck)
        run: |
          cppcheck --enable=warning,style,performance,portability --error-exitcode=1 \
            --inline-suppr --quiet \
            --suppress=missingIncludeSystem \
            --suppress=missingInclude \
            -I. .
