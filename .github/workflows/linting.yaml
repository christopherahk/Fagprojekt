name: Code Quality (Linting)

on: [push, pull_request]

jobs:
  style-and-logic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Clang-Format
        run: sudo apt-get update && sudo apt-get install -y clang-format clang-tidy cppcheck

      - name: Check Formatting
        run: |
          find src include test -type f \( -name "*.h" -o -name "*.hpp" -o -name "*.c" -o -name "*.cc" -o -name "*.cpp" \) \
            -print0 | xargs -0 clang-format --dry-run --Werror

      - name: Set up Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Install Arduino AVR Core
        run: |
          arduino-cli core update-index
          arduino-cli core install arduino:avr

      - name: Compile Sketch (Arduino CLI)
        run: arduino-cli compile --fqbn arduino:avr:uno Fagprojekt.ino

      - name: Static Analysis (clang-tidy)
        run: |
          find . -type f \( -name "*.cpp" -o -name "*.cc" -o -name "*.c" \) \
            -not -path "./.git/*" -print0 | \
            xargs -0 -r clang-tidy --warnings-as-errors='*'

      - name: Static Analysis (cppcheck)
        run: |
          cppcheck --enable=warning,style,performance,portability,information --error-exitcode=1 \
            --inline-suppr --quiet .
